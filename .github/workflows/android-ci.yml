name: Rakyzu Music Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build 0.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      RAKYZU_API_BASE_URL: ${{ secrets.RAKYZU_API_BASE_URL }}
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout Rakyzu Music
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Install Android SDK 37.0
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate Home milestone
        run: >-
          ./gradlew :feature:home:testDebugUnitTest :feature:home:lintDebug
          :feature:home:assembleDebugAndroidTest --stacktrace

      - name: Validate Search milestone
        run: >-
          ./gradlew :feature:search:testDebugUnitTest :feature:search:lintDebug
          :feature:search:assembleDebugAndroidTest --stacktrace

      - name: Validate Android project
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Upload Rakyzu Music debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rakyzu-Music-0.2.1-debug
          path: apps/android/app/build/outputs/apk/debug/Rakyzu-Music-0.2.1-debug.apk
          if-no-files-found: error
          retention-days: 14
