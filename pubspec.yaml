name: rakyzu_music
description: "Rakyzu Music - Your Sound, Your Vibe."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  audio_service: ^0.18.14
  cupertino_icons: ^1.0.8
  dio: ^5.5.0
  file_picker: ^8.0.5
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  google_mobile_ads: ^5.1.0
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  riverpod_annotation: ^2.3.5
  share_plus: ^10.0.2
  shared_preferences: ^2.3.0
  webview_flutter: ^4.8.0
  url_launcher: ^6.2.0
  sign_in_with_apple: ^6.1.0
  supabase_flutter: ^2.5.5
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.8
  custom_lint: ^0.6.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  http: ^1.2.1
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700